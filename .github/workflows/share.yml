# The zip to share tabby-remote with a coworker: the plugin, its production dependencies and SHARE-README.md, nothing
# personal. A v* tag attaches it to that tag's release; a manual run keeps it as the run's artifact.
name: share

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches package.json's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$version" ] || { echo "tag $GITHUB_REF_NAME, but package.json says $version"; exit 1; }
      - name: Build the zip
        id: build
        run: echo "zip=$(bash share/pack.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Leak check
        run: |
          rm -rf check && mkdir check
          unzip -q "${{ steps.build.outputs.zip }}" -d check
          bash .github/leak-check.sh check
      - name: The leak check catches a planted leak
        run: |
          cp -r check planted
          echo 'run from the claude-sessions workflow' > planted/tabby-remote/web/planted.txt
          if bash .github/leak-check.sh planted; then echo 'the leak check missed a planted leak'; exit 1; fi
      - name: Keep as the run's artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabby-remote-zip
          path: ${{ steps.build.outputs.zip }}
      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Unzip it and give INSTALL.md to your agent; README.md says what it does."
          gh release upload "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --clobber
